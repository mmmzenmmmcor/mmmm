<title>Sydbyggarna Resursplanering</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: dark spruce sidebar (brand + navigation) beside a calm stone workspace; the planning grid is the hero. */
:root{
  --bg:#EDEFEB; --surface:#FFFFFF; --surface-2:#F5F6F3; --ink:#14201B; --muted:#5D6963; --faint:#8A948E;
  --line:#DDE2DC; --line-strong:#C2CAC3; --accent:#1E4A38; --accent-ink:#FFFFFF; --accent-soft:#E2ECE6;
  --brass:#97753F; --side:#0F1D17; --side-ink:#E8EEE9; --side-muted:#8C9D93; --side-line:#213229; --side-hi:#1A2C23;
  --danger:#B0412D; --ok:#2E7A55; --abs-bg:#F3E7E2; --abs-ink:#9C3A28; --abs-hatch:rgba(156,58,40,.10);
  --sel:rgba(30,74,56,.14); --sel-line:#1E4A38; --today:rgba(151,117,63,.08); --holiday:rgba(176,65,45,.06);
  --chip-ink:#14201B; --hired-bg:#F7F1E5; --we-bg:#F1F3EF; --bygg-bg:#EAF1F7; --bygg-ink:#2F6086; --cap:#DCE3DD; --st-red-bg:#FBE3DF; --st-red:#A3341F; --st-green-bg:#DCF0E2; --st-green:#1F6B43; --st-amber-bg:#FBEFCB; --st-amber:#855700; --st-grey-bg:#ECEEEA; --st-grey:#5D6963;
  --shadow:0 1px 2px rgba(15,29,23,.05),0 10px 30px -8px rgba(15,29,23,.14);
  --shadow-lg:0 2px 6px rgba(15,29,23,.08),0 28px 60px -12px rgba(15,29,23,.28);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B110F; --surface:#111916; --surface-2:#16201C; --ink:#E6ECE8; --muted:#9BA8A1; --faint:#6C7973;
  --line:#202C27; --line-strong:#2E3D36; --accent:#8CC7A8; --accent-ink:#0B110F; --accent-soft:#1B2C24;
  --brass:#D0AC72; --side:#070D0B; --side-ink:#E8EEE9; --side-muted:#80918A; --side-line:#17231E; --side-hi:#12201A;
  --danger:#E8836F; --ok:#7CC39E; --abs-bg:#2A1A16; --abs-ink:#F09A86; --abs-hatch:rgba(240,154,134,.08);
  --sel:rgba(140,199,168,.16); --hired-bg:#1D1A12; --we-bg:#0E1513; --bygg-bg:#10202B; --bygg-ink:#9CC6EE; --cap:#25332C; --st-red-bg:#3A1C17; --st-red:#F2A090; --st-green-bg:#16301F; --st-green:#8FD3A8; --st-amber-bg:#352A10; --st-amber:#EBC66E; --st-grey-bg:#1E2824; --st-grey:#9BA8A1; --sel-line:#8CC7A8; --today:rgba(208,172,114,.07); --holiday:rgba(232,131,111,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 28px 60px -12px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B110F; --surface:#111916; --surface-2:#16201C; --ink:#E6ECE8; --muted:#9BA8A1; --faint:#6C7973;
  --line:#202C27; --line-strong:#2E3D36; --accent:#8CC7A8; --accent-ink:#0B110F; --accent-soft:#1B2C24;
  --brass:#D0AC72; --side:#070D0B; --side-ink:#E8EEE9; --side-muted:#80918A; --side-line:#17231E; --side-hi:#12201A;
  --danger:#E8836F; --ok:#7CC39E; --abs-bg:#2A1A16; --abs-ink:#F09A86; --abs-hatch:rgba(240,154,134,.08);
  --sel:rgba(140,199,168,.16); --hired-bg:#1D1A12; --we-bg:#0E1513; --bygg-bg:#10202B; --bygg-ink:#9CC6EE; --cap:#25332C; --st-red-bg:#3A1C17; --st-red:#F2A090; --st-green-bg:#16301F; --st-green:#8FD3A8; --st-amber-bg:#352A10; --st-amber:#EBC66E; --st-grey-bg:#1E2824; --st-grey:#9BA8A1; --sel-line:#8CC7A8; --today:rgba(208,172,114,.07); --holiday:rgba(232,131,111,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 28px 60px -12px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* ---------- Sidebar ---------- */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding-block:24px 20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;border-right:1px solid var(--side-line)}
.brand{display:flex;flex-direction:column;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--side-line)}
.logo-slot{height:44px;display:flex;align-items:center}
.logo-slot img{max-height:44px;max-width:180px;object-fit:contain}
.mark{display:flex;align-items:center;gap:10px}
.mark svg{flex:none}
.mark b{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:15px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.02em;color:var(--side-muted);line-height:1.3}
.brand h1 strong{display:block;color:var(--side-ink);font-weight:600;font-size:18px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:20px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--side-muted);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{color:var(--side-ink);background:var(--side-hi)}
.nav a[aria-current="page"]{color:var(--side-ink);background:var(--side-hi);box-shadow:inset 0 0 0 1px var(--side-line)}
.nav a svg{opacity:.85}
.nav .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--side-muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:12px;color:var(--side-muted)}
.sync{display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:#5FBF8C;box-shadow:0 0 0 3px rgba(95,191,140,.18)}
.sync.saving i{background:#D0AC72;box-shadow:0 0 0 3px rgba(208,172,114,.2);animation:pulse 1s infinite}
.sync.off i{background:#8C9D93;box-shadow:none}
@keyframes pulse{50%{opacity:.4}}
.side-foot .who{border-top:1px solid var(--side-line);padding-top:12px;line-height:1.5}

/* ---------- Main ---------- */
.main{min-width:0;padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 24px;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600}
.head h2{margin:4px 0 0;font-family:var(--f-display);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.head .sub{margin-top:6px;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;transition:border-color .15s,background .15s,transform .05s}
.btn:hover{border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:8px 10px}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.navweek{display:inline-flex;align-items:center;gap:4px}

.banner{display:flex;gap:10px;align-items:center;padding:12px 16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:16px;color:var(--muted)}
.banner b{color:var(--ink)}

/* Project legend */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lg{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:12.5px;transition:opacity .15s,border-color .15s}
.lg:hover{border-color:var(--line-strong)}
.lg .sw{width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:var(--chip-ink);font-size:9px;font-weight:700;font-family:var(--f-mono)}
.lg .n{font-family:var(--f-mono);font-weight:600}
.lg .t{color:var(--muted)}
.lg .h{font-family:var(--f-mono);color:var(--faint);font-size:11px}
.lg[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.legend.focusing .lg[aria-pressed="false"]{opacity:.45}
.lg-hint{font-size:12px;color:var(--faint);align-self:center;margin-left:4px}
.bar2{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 20px;margin-bottom:16px}
.bar2 .legend{margin-bottom:0;flex:1 1 420px;min-width:0}
.bar2-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.hired-key{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.hired-key i{width:22px;height:16px;border-radius:5px;border:1.5px dashed var(--brass);background:var(--hired-bg)}
.lang-f{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 3px 3px 12px}
.lang-f span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.lang-f select{border:0;background:var(--surface-2);border-radius:7px;padding:5px 8px;font-weight:600;font-size:13px}
/* Hired craftspeople: dashed brass frame around the name cell */
.plan tr.hired th.who{background:var(--hired-bg)}
.plan tr.hired th.who::before{content:"";position:absolute;inset:5px 7px;border:1.5px dashed var(--brass);border-radius:9px;pointer-events:none;opacity:.75}
.plan tbody tr.hired:hover th.who{background:var(--hired-bg)}
.hb{display:inline-block;vertical-align:1px;margin-right:6px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);border-radius:4px;padding:0 4px;line-height:14px}
.who .lc{display:inline-flex;gap:3px;margin-left:auto}
.who .lc b{font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:0 3px;line-height:14px}
.who .lc b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.who .meta{max-width:212px}
.plan tr.dim th,.plan tr.dim td{opacity:.28}

/* ---------- Planning grid ---------- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.scroller{overflow:auto;max-height:calc(100vh - 250px);min-height:280px}
table.plan{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;user-select:none;-webkit-user-select:none}
.plan th,.plan td{border-bottom:1px solid var(--line);padding:0}
.plan thead th{position:sticky;background:var(--surface);z-index:3}
.plan thead tr:first-child th{top:0;height:44px}
.plan thead tr:nth-child(2) th{top:44px;height:46px;border-bottom:1px solid var(--line-strong)}
.plan .corner{left:0;z-index:5 !important;text-align:left;padding:0 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;vertical-align:bottom;padding-bottom:12px;border-right:1px solid var(--line-strong);min-width:248px;width:248px}
.wkh{text-align:left;padding:0 12px !important;border-left:1px solid var(--line-strong);vertical-align:middle;white-space:nowrap}
.wkh .w{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.wkh .r{color:var(--faint);font-size:12px;margin-left:8px}
.dh{min-width:84px;width:84px;font-weight:500;text-align:left;padding:0 10px !important;vertical-align:middle}
.dh .dn{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.dh .dd{display:block;font-family:var(--f-mono);font-size:13px;color:var(--ink);font-weight:500}
.dh.today .dd{color:var(--brass)}
.dh.today .dn{color:var(--brass)}
.dh.today::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--brass);border-radius:2px}
.dh.hol .dn{color:var(--danger)}
.dh .hn{display:block;font-size:10px;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px}
.ws{border-left:1px solid var(--line-strong) !important}

.plan tbody th{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;font-weight:400;border-right:1px solid var(--line-strong)}
.grp th{background:var(--surface-2) !important;height:34px;white-space:nowrap;padding:0 18px !important;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.grp th span{color:var(--faint);font-family:var(--f-mono);letter-spacing:0;margin-left:8px}
.grp td{background:var(--surface-2)}
.who{padding:0 18px !important;height:52px}
.who .nm{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:212px}
.who .meta{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--faint);margin-top:1px}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.plan tbody tr:not(.grp):hover th,.plan tbody tr:not(.grp):hover td{background-color:var(--surface-2)}

td.c{height:52px;width:84px;min-width:84px;max-width:84px;padding:4px !important;position:relative;cursor:cell;border-left:1px solid var(--line)}
td.c.ws{border-left:1px solid var(--line-strong)}
td.c.today{background:var(--today)}
td.c.hol{background:var(--holiday)}
td.c.sel{background:var(--sel) !important}
td.c.sel::after{content:"";position:absolute;inset:0;border:1.5px solid var(--sel-line);pointer-events:none}
.ro td.c{cursor:default}
.chip{height:100%;border-radius:7px;background:var(--c);color:var(--chip-ink);display:flex;flex-direction:column;justify-content:center;padding:0 8px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:opacity .15s,transform .15s}
.chip .num{font-family:var(--f-mono);font-weight:600;font-size:13px;line-height:1.1}
.chip .nt{font-size:10.5px;line-height:1.15;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.miss{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 4px,var(--line) 4px,var(--line) 5px);color:var(--muted)}
.abs{height:100%;border-radius:7px;background:repeating-linear-gradient(-45deg,var(--abs-bg),var(--abs-bg) 6px,var(--abs-hatch) 6px,var(--abs-hatch) 7px);color:var(--abs-ink);display:flex;flex-direction:column;justify-content:center;padding:0 8px;font-weight:600;font-size:11.5px;letter-spacing:.02em;overflow:hidden}
.abs .nt{font-weight:400;font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan.focus .chip:not(.on),.plan.focus .abs,.plan.focus .part:not(.on){opacity:.18}
.plan.focus .chip.on{box-shadow:0 0 0 2px var(--ink)}
tfoot th,tfoot td{position:sticky;bottom:0;background:var(--surface-2);border-top:1px solid var(--line-strong);height:40px;z-index:2}
tfoot th{left:0;z-index:4 !important;text-align:left;padding:0 18px !important;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;border-right:1px solid var(--line-strong)}
tfoot td{padding:0 10px !important;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
tfoot td b{color:var(--ink);font-weight:600}
.board-foot{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.board-foot kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* Empty / loading */
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto;max-width:46ch}
.skel{height:52px;margin:6px 18px;border-radius:8px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Picker ---------- */
.pop{position:fixed;z-index:50;width:360px;overflow:hidden;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:min(560px,calc(100vh - 24px));animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
.pop-h{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.pop-h .t{font-weight:600}
.pop-h .s{font-size:12px;color:var(--faint)}
.pop-search{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.pop-b{overflow:auto;padding:8px;flex:1;min-height:0}
.pop-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 8px 6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:8px}
.opt:hover,.opt.hl{background:var(--surface-2)}
.opt .sw{width:28px;height:28px;border-radius:7px;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.opt .n{font-family:var(--f-mono);font-weight:600;font-size:13px}
.opt .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .tx{min-width:0;display:flex;flex-direction:column}
.abs-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 6px}
.abs-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--abs-ink)}
.abs-btn:hover{background:var(--abs-bg)}
.pop-f{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.pop-f label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.note-row{display:flex;gap:6px}
.note-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px}
.pop-actions{display:flex;justify-content:space-between;gap:8px}

/* ---------- Toast ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:14px;background:var(--side);color:var(--side-ink);padding:10px 12px 10px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;animation:pop .18s ease-out;max-width:calc(100vw - 32px)}
.toast button{background:none;border:1px solid var(--side-line);color:var(--side-ink);border-radius:8px;padding:4px 10px;font-weight:600;font-size:12px}

/* ---------- Overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.meter{height:6px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-h h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.section-h p{margin:0;color:var(--faint);font-size:12.5px}
table.mx{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:0}
.mx thead th{background:var(--surface);position:sticky;top:0;z-index:2;height:40px;font-weight:500}
.mx .pj{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:0 16px !important;min-width:248px;border-right:1px solid var(--line-strong)}
.mx thead .pj{z-index:3}
.pjc{display:flex;align-items:center;gap:10px;height:50px}
.pjc .sw{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.pjc .n{font-family:var(--f-mono);font-weight:600}
.pjc .m{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.mx td.h{width:44px;min-width:44px;text-align:center;font-family:var(--f-mono);font-size:12px;border-left:1px solid var(--line)}
.mx td.h span{display:grid;place-items:center;height:34px;margin:0 3px;border-radius:6px;color:var(--chip-ink);font-weight:600}
.mx td.h.z{color:var(--faint)}
.mx th.dsm{width:44px;min-width:44px;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;border-left:1px solid var(--line)}
.mx th.dsm b{display:block;font-family:var(--f-mono);color:var(--ink);font-weight:500;letter-spacing:0;font-size:12px}
.mx .tot{padding:0 16px !important;text-align:right;font-family:var(--f-mono);border-left:1px solid var(--line-strong);white-space:nowrap}
.mx .tot b{font-size:15px}
.mx .split{color:var(--faint);font-size:11px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.badge{min-width:54px;height:36px;padding:0 10px;border-radius:8px;background:var(--c);color:var(--chip-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.card-h .nm{font-weight:600;font-size:15px;line-height:1.2}
.card-h .cl{font-size:12px;color:var(--muted)}
.card-h .dv{margin-left:auto;text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.card-h .dv b{display:block;font-size:18px;color:var(--ink)}
.crew{display:flex;flex-direction:column;gap:2px}
.crew-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.crew-r .p{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew-r .p small{color:var(--faint);font-weight:400;margin-left:6px}
.dots{display:flex;gap:3px;align-items:center}
.dots i{width:7px;height:14px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--c)}
.dots i.gap{width:6px;background:none}

/* ---------- Register ---------- */
.reg-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.panel-h p{margin:2px 0 0;font-size:12.5px;color:var(--faint)}
.tbl-wrap{overflow-x:auto}
table.reg{border-collapse:collapse;width:100%;min-width:720px}
.reg th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.reg td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.reg tr.off td{opacity:.55}
.reg input[type=text],.reg select{width:100%;border:1px solid transparent;background:none;border-radius:7px;padding:6px 8px}
.reg input[type=text]:hover,.reg select:hover{border-color:var(--line)}
.reg input[type=text]:focus,.reg select:focus{border-color:var(--accent);background:var(--surface);outline:none}
.reg input.mono{font-family:var(--f-mono);font-weight:600}
.reg tr.add td{background:var(--surface-2)}
.reg tr.add input,.reg tr.add select{border-color:var(--line);background:var(--surface)}
.reg-people{min-width:1100px}
.reg tr.hired-r td:first-child{background:var(--hired-bg);box-shadow:inset 3px 0 0 var(--brass)}
.reg tr.hired-r td:first-child .hb{margin-left:4px}
.langs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.lchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 3px;font-size:12px}
.lchip b{font-family:var(--f-mono);font-size:9.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 5px}
.lchip button{border:0;background:none;color:var(--faint);padding:0 4px;font-size:14px;line-height:1;border-radius:50%}
.lchip button:hover{color:var(--danger)}
.reg select.ladd{width:auto;border:1px dashed var(--line-strong);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted)}
.swbtn{width:28px;height:28px;border-radius:7px;background:var(--c);border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.palette{display:grid;grid-template-columns:repeat(6,28px);gap:8px;padding:12px}
.palette button{width:28px;height:28px;border-radius:7px;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:12px;font-weight:600}
.toggle i{width:26px;height:16px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle[aria-pressed="true"] i{background:var(--ok)}
.toggle[aria-pressed="true"] i::after{left:12px}
.rowbtns{display:flex;gap:2px;justify-content:flex-end}
.rowbtns .btn{padding:5px 8px}
.logo-box{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:18px}
.logo-prev{width:220px;height:84px;border:1px dashed var(--line-strong);border-radius:12px;display:grid;place-items:center;background:var(--surface-2);overflow:hidden}
.logo-prev img{max-width:190px;max-height:64px;object-fit:contain}
.muted{color:var(--muted)}
.faint{color:var(--faint)}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(7,13,11,.48);backdrop-filter:blur(3px);z-index:70;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease-out;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal-h{padding:22px 24px 6px}
.modal-h h3{margin:4px 0 0;font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:-.01em}
.modal-b{padding:14px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.field select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2)}
.check{display:flex;gap:10px;align-items:center;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.sheet{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:8px}
.sheet .sh-top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sheet .sh-top b{font-family:var(--f-display);font-size:14px}
.sheet .sh-top span{font-size:11px;color:var(--faint)}
.sheet .sh-grid{display:grid;gap:2px}
.sheet .sh-row{display:grid;gap:2px;grid-template-columns:70px repeat(var(--n),1fr)}
.sheet .sh-row i{height:7px;border-radius:2px;background:var(--line)}
.sheet .sh-row em{height:7px;border-radius:2px;background:var(--line-strong);opacity:.5}
.modal-f{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}
.err{color:var(--danger);font-size:12.5px}


/* ---------- Avatars ---------- */
.av{--s:30px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--bg);display:inline-grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--surface);position:relative;font-family:var(--f-body);color:#3B4540;font-weight:700;font-size:calc(var(--s)*.36);letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .em{font-size:calc(var(--s)*.62);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transform:translateY(1px)}
.av.can{cursor:pointer;transition:transform .15s}
.av.can:hover{transform:scale(1.06)}
.av.can:hover::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px var(--accent)}
.av.more{background:var(--surface-2);color:var(--muted);font-size:10.5px;font-family:var(--f-mono);border:1px solid var(--line)}
.avs{display:inline-flex;align-items:center}
.avs .av{margin-left:-7px}
.avs .av:first-child{margin-left:0}
.whoi{display:flex;align-items:center;gap:10px;min-width:0}
.wt{display:flex;flex-direction:column;min-width:0}
.who .whoi .nm{max-width:168px}
.who .whoi .meta{max-width:168px}
.av-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.av-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.bgs{display:flex;gap:6px;flex-wrap:wrap}
.bgs button{width:24px;height:24px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bgs button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.av-photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.tones{display:flex;gap:4px}
.tones button{border:1px solid transparent;background:none;border-radius:8px;font-size:18px;padding:2px 6px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tones button[aria-pressed="true"]{border-color:var(--line-strong);background:var(--surface-2)}
.emo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:220px;overflow:auto;padding:2px}
.emo-grid button{aspect-ratio:1;border:1px solid transparent;background:var(--surface-2);border-radius:10px;font-size:24px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transition:transform .1s}
.emo-grid button:hover{transform:scale(1.08);border-color:var(--line-strong)}
.emo-grid button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}

/* ---------- Pills & status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--st-grey-bg);color:var(--st-grey)}
.pill.red{background:var(--st-red-bg);color:var(--st-red)}
.pill.green{background:var(--st-green-bg);color:var(--st-green)}
.pill.amber{background:var(--st-amber-bg);color:var(--st-amber)}
.pill.grey{background:var(--st-grey-bg);color:var(--st-grey)}
.neg{color:var(--st-red) !important}
.pos{color:var(--st-green) !important}
.badge.sm{min-width:46px;height:28px;font-size:12.5px;border-radius:7px;padding:0 8px;flex:none}

/* ---------- Tooltip ---------- */
.tip{position:fixed;z-index:80;background:#1B1F1D;color:#F1F4F2;border-radius:12px;padding:10px 12px;min-width:200px;max-width:300px;box-shadow:0 12px 32px -6px rgba(0,0,0,.4);font-size:12.5px;pointer-events:none;display:flex;flex-direction:column;gap:5px}
.tt-h{font-weight:600;font-size:13px;margin-bottom:2px}
.tt-r{display:flex;align-items:center;gap:8px;color:#C9D1CC}
.tt-r b{margin-left:auto;color:#F1F4F2;font-family:var(--f-mono);font-weight:600}
.tt-r b.neg{color:#F49A88 !important}
.tt-r b.pos{color:#8FD3A8 !important}
.tt-r .av{box-shadow:none}
.tt-d{font-family:var(--f-mono);font-size:11px;color:#8E9993;width:26px}
.tt-bal{border-top:1px solid #333A36;padding-top:5px;margin-top:2px}
.tt-n{color:#C9D1CC}
.tt-f{color:#8E9993;font-size:11.5px}
.k{width:10px;height:10px;border-radius:3px;background:#5B6560;flex:none;display:inline-block}
.k.cap{background:var(--cap)}
.tip .k.cap{background:#5B6A62}
.k.plan{background:var(--accent)}
.tip .k.plan{background:#8CC7A8}
.k.need{height:3px;border-radius:2px;background:var(--brass);width:14px}
.k.abs{background:repeating-linear-gradient(-45deg,#F3E7E2,#F3E7E2 2px,#C98F80 2px,#C98F80 3px)}

/* ---------- Dashboard ---------- */
.v.neg,.v.pos{}
.panel.dash{margin-bottom:18px}
.panel.dash .panel-h h3 .cnt{font-family:var(--f-mono);font-size:13px;color:var(--faint);font-weight:500;margin-left:6px}
.ch-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.ch-legend span{display:inline-flex;align-items:center;gap:7px}
.ch-wrap{overflow-x:auto;padding:14px 22px 8px}
.chart{display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-grid.base{stroke:var(--line-strong)}
.ch-ax{font:11px var(--f-mono);fill:var(--faint)}
.ch-day{font:11px var(--f-body);fill:var(--muted)}
.ch-day.today{fill:var(--brass);font-weight:700}
.ch-wk{stroke:var(--line);stroke-dasharray:3 3}
.ch-wkl{font:600 11px var(--f-body);fill:var(--ink)}
.ch-cap{fill:var(--cap)}
.ch-plan{fill:var(--accent)}
.ch-need{stroke:var(--brass);stroke-width:2.5;stroke-linecap:round}
.ch-def{font:700 11px var(--f-mono);fill:var(--st-red)}
.ch-sur{font:600 11px var(--f-mono);fill:var(--st-green)}
.ch-hit{fill:transparent;cursor:default}
.ch-hit:hover{fill:var(--sel)}
table.dt{width:100%;border-collapse:collapse;min-width:820px}
.dt th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink);padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dt th+th,.dt td+td{border-left:1px solid var(--line)}
.dt td{padding:9px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tbody tr:hover td{background:var(--surface-2)}
.dt tbody tr:last-child td{border-bottom:0}
.cellp{display:flex;align-items:center;gap:12px;min-width:0}
.cellp .nm,.wt .nm2{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt .nm2{font-weight:500}
.cellp .meta,.dt .wt .meta{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;flex-direction:column;gap:5px;min-width:110px}
.prog .mono{font-size:12px;color:var(--muted)}
.bar{display:block;height:6px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar i.under{background:var(--st-red)}
.bar i.over{background:var(--st-amber)}
.wkbars{display:flex;gap:4px;cursor:default}
.wb{display:flex;flex-direction:column;align-items:center;gap:4px;width:34px}
.wb em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.wb i{display:block;width:100%;height:6px;border-radius:3px}
.wb i.none{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.wb i.abs{background:repeating-linear-gradient(-45deg,var(--abs-bg),var(--abs-bg) 2px,var(--abs-ink) 2px,var(--abs-ink) 3px);opacity:.7}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--faint);min-width:240px}
.search input{border:0;background:none;outline:none;width:100%;color:var(--ink)}
.dash-stack{display:flex;flex-direction:column}

/* ---------- Demand ---------- */
.bal .bn,.need td.nc{text-align:center;font-family:var(--f-mono);font-size:13px;border-left:1px solid var(--line);height:44px}
.bal .bn.ws,.need td.nc.ws{border-left:1px solid var(--line-strong)}
.bal .who,.need .who{height:46px}
.bal tr.balrow th,.bal tr.balrow td{background:var(--surface-2)}
.bv{display:inline-block;min-width:34px;padding:2px 6px;border-radius:6px;font-weight:600;font-size:12.5px}
.bv.neg{background:var(--st-red-bg)}
.bv.pos{background:var(--st-green-bg)}
.bv.zero{background:var(--st-grey-bg);color:var(--st-grey)}
.freeb{display:inline-block;min-width:26px;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:default}
.need td.nc{width:84px;min-width:84px;padding:4px !important;position:relative}
.need td.nc .ni{width:100%;height:28px;border:1px solid transparent;border-radius:7px;background:transparent;text-align:center;font:600 14px var(--f-mono);color:var(--ink);-moz-appearance:textfield}
.need td.nc .ni::-webkit-outer-spin-button,.need td.nc .ni::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.need td.nc .ni:hover{border-color:var(--line-strong);background:var(--surface)}
.need td.nc .ni:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.need td.nc .pl{display:block;font-size:10px;color:var(--faint);margin-top:1px}
.need td.nc.under{background:var(--st-red-bg)}
.need td.nc.under .pl{color:var(--st-red);font-weight:600}
.need td.nc.over{background:var(--st-amber-bg)}
.need td.nc.over .pl{color:var(--st-amber);font-weight:600}
.need td.nc.ok .pl{color:var(--st-green);font-weight:600}
.need th.sumh{min-width:200px;border-left:1px solid var(--line-strong);text-align:left;padding:0 14px !important}
.need td.sumc{padding:0 14px !important;border-left:1px solid var(--line-strong);white-space:nowrap}
.need td.sumc .mono{margin-right:10px;font-size:12.5px;color:var(--muted)}
.need td.sumc .mono b{color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.card-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}

<script>
(() => {
/* ================= Constants ================= */
const DAYS = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const DAYS_LONG = ['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const ABS = [
  {k:'ledig', label:'Ledig'}, {k:'semester', label:'Semester'}, {k:'sjuk', label:'Sjuk'}, {k:'vab', label:'VAB'},
  {k:'foraldra', label:'Föräldraledig'}, {k:'atf', label:'ATF'}, {k:'lakare', label:'Läkarbesök'}, {k:'tandlakare', label:'Tandläkare'},
  {k:'komp', label:'Kompledig'}, {k:'tjl', label:'Tjänstledig'}, {k:'utb', label:'Utbildning'}, {k:'ovrigt', label:'Övrig frånvaro'},

const QUICK = [

  {label:'Läkarbesök em', part:'em', s:'lakare'}, {label:'Läkarbesök fm', part:'fm', s:'lakare'}, {label:'ATF em', part:'em', s:'atf'},
];
const ABS_LABEL = Object.fromEntries(ABS.map(a => [a.k, a.label]));
const PALETTE = ['#E8894A','#8DB8E0','#B48CE8','#A9CC9A','#EBCB6B','#B9BDB8','#6FBFB4','#E59A9A','#7E9CC9','#C5BF6E','#D08A70','#B08AB8'];

const STAFF_ROLES = new Set(ROLES[0].items);
const STAFF = 'Tjänstemän';
const isStaff = p => STAFF_ROLES.has(p.tag);
const roleShort = t => (String(t||'').match(/\(([^)]+)\)\s*$/)||[])[1] || t;
const COUNTRIES = ['Sverige','Afghanistan','Albanien','Algeriet','Argentina','Armenien','Australien','Azerbajdzjan','Belgien','Bosnien och Hercegovina','Brasilien','Bulgarien','Chile','Colombia','Cypern','Danmark','Egypten','Eritrea','Estland','Etiopien','Filippinerna','Finland','Frankrike','Georgien','Ghana','Grekland','Indien','Indonesien','Irak','Iran','Irland','Island','Italien','Japan','Jordanien','Kanada','Kazakstan','Kenya','Kina','Kosovo','Kroatien','Kuba','Lettland','Libanon','Litauen','Luxemburg','Marocko','Mexiko','Moldavien','Montenegro','Nederländerna','Nigeria','Nordmakedonien','Norge','Pakistan','Palestina','Peru','Polen','Portugal','Rumänien','Ryssland','Schweiz','Serbien','Slovakien','Slovenien','Somalia','Spanien','Storbritannien','Sudan','Sydafrika','Syrien','Thailand','Tjeckien','Tunisien','Turkiet','Tyskland','Ukraina','Ungern','USA','Uzbekistan','Vietnam','Vitryssland','Österrike'];

const LANG_CODE = {Svenska:'SV',Engelska:'EN',Albanska:'SQ',Arabiska:'AR',Bosniska:'BS',Bulgariska:'BG',Danska:'DA',Dari:'PRS',Estniska:'ET',Finska:'FI',Franska:'FR',Grekiska:'EL',Hindi:'HI',Italienska:'IT',Kinesiska:'ZH',Kroatiska:'HR',Kurdiska:'KU',Lettiska:'LV',Litauiska:'LT',Nederländska:'NL',Norska:'NO',Pashto:'PS',Persiska:'FA',Polska:'PL',Portugisiska:'PT',Rumänska:'RO',Ryska:'RU',Serbiska:'SR',Slovakiska:'SK',Somaliska:'SO',Spanska:'ES',Tagalog:'TL',Thai:'TH',Tigrinja:'TI',Tjeckiska:'CS',Turkiska:'TR',Tyska:'DE',Ukrainska:'UK',Ungerska:'HU',Urdu:'UR',Vietnamesiska:'VI'};
const langCode = l => LANG_CODE[l] || l.slice(0,2).toUpperCase();

/* ================= State ================= */
const S = {
  view: 'planering',
  start: null,
  weeks: 3,
  people: [], projects: [], weeksData: new Map(), settings: {},
  db: null, user: null, assets: null, downloads: null,
  canWrite: true, status: 'loading', // loading | ready | nodb | timeout

};
const $main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try { const w = +localStorage.getItem('sb.weeks'); if ([1,2,3,4,6].includes(w)) S.weeks = w; } catch(e) {}
S.collapsed = new Set(); try { S.collapsed = new Set(JSON.parse(localStorage.getItem('sb.collapsed')||'[]')); } catch(e) {}

/* ================= Dates ================= */
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y = t.getUTCFullYear(); return {y, w: Math.ceil(((t - Date.UTC(y,0,1))/864e5 + 1)/7)}; }
function wkKey(mon){ const {y,w} = isoWeek(mon); return y+'-W'+String(w).padStart(2,'0'); }
const fmtShort = d => d.getDate()+' '+MONTHS[d.getMonth()];
function fmtRange(a,b){ return a.getMonth()===b.getMonth() ? a.getDate()+'–'+b.getDate()+' '+MONTHS[b.getMonth()] : fmtShort(a)+' – '+fmtShort(b); }
const today = new Date(); const TODAY = ymd(today);
S.start = mondayOf(today);

function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
const holCache = {};
function holidays(y){
  if (holCache[y]) return holCache[y];
  const e = easter(y), H = {};
  const put = (d,n) => H[ymd(d)] = n;

const holidayName = d => holidays(d.getFullYear())[ymd(d)] || '';

function byggRange(){ const b = (S.settings && S.settings.bygg) || {}; return {from: b.from==null ? 28 : +b.from, to: b.to==null ? 31 : +b.to}; }
function isBygg(w){ const r = byggRange(); return r.from > 0 && w >= r.from && w <= r.to; }

/* ================= Data helpers ================= */
const projById = id => S.projects.find(p => p.id===id);
function getCell(wk,pid,d){ const w = S.weeksData.get(wk); return (w && w[pid] && w[pid][d]) || null; }
function setLocal(wk,pid,d,val){ let w = S.weeksData.get(wk); if (!w){ w = {}; S.weeksData.set(wk,w); } if (!w[pid]) w[pid] = {}; w[pid][d] = cleanVal(val); }
/* A cell is one full-day item {p}|{s} or a split day {fm, em}; n is a note. */
const itemOf = o => o && (o.p || o.s) ? (o.p ? {p:o.p} : {s:o.s}) : null;
function partsOf(v){ if (!v) return []; if (v.fm || v.em) return [itemOf(v.fm), itemOf(v.em)]; const it = itemOf(v); return it ? [it] : []; }
const sameItem = (a,b) => (!a && !b) || (!!a && !!b && (a.p||null)===(b.p||null) && (a.s||null)===(b.s||null));
function loadOf(v){ const ps = partsOf(v), w = ps.length===2 ? .5 : 1, proj = {}; let abs = 0; for (const it of ps){ if (!it) continue; if (it.p) proj[it.p] = (proj[it.p]||0) + w; else abs += w; } return {proj, abs, work: Object.values(proj).reduce((a,b)=>a+b,0)}; }
function cleanVal(v){
  if (!v) return null; const o = {};
  if (v.fm || v.em){ const a = itemOf(v.fm), b = itemOf(v.em); if (sameItem(a,b)){ if (a) Object.assign(o,a); } else { o.fm = a; o.em = b; } }
  else { const it = itemOf(v); if (it) Object.assign(o,it); }
  if (v.n) o.n = v.n;
  return Object.keys(o).length ? o : null;
}
function fullShape(v){ /* every field written, so a merge-update can never leave stale fields behind */
  v = cleanVal(v); if (!v) return null;
  const fi = it => it ? {p: it.p||null, s: it.s||null} : null;
  if (v.fm || v.em) return {p:null, s:null, fm:fi(v.fm), em:fi(v.em), n:v.n||null};
  return {p:v.p||null, s:v.s||null, fm:null, em:null, n:v.n||null};
}
const fmtN = x => Number.isInteger(x) ? String(x) : (Math.round(x*10)/10).toFixed(1).replace('.',',').replace(',0','');
const itemLabel = it => !it ? '–' : it.p ? ((projById(it.p)||{}).number || '?') : (ABS_LABEL[it.s] || it.s);
function cellText(v, withNote=true){ const ps = partsOf(v); let t = ps.length===2 ? itemLabel(ps[0])+' fm / '+itemLabel(ps[1])+' em' : ps.length ? itemLabel(ps[0]) : ''; if (withNote && v && v.n) t += (t?'\n':'') + v.n; return t; }
const craftPeople = () => activePeople().filter(p => !isStaff(p));
const activePeople = () => S.people.filter(p => p.active !== false).sort((a,b)=>(a.order??999)-(b.order??999) || a.name.localeCompare(b.name,'sv'));
function groupsOf(people){
  const m = new Map();
  for (const p of people){ const c = isStaff(p) ? STAFF : (p.company || OWN_COMPANY); if (!m.has(c)) m.set(c, []); m.get(c).push(p); }
  const rank = k => k===OWN_COMPANY ? 0 : k===STAFF ? 2 : 1;
  return [...m.entries()].sort((a,b) => rank(a[0])-rank(b[0]) || a[0].localeCompare(b[0],'sv'));
}

/* ================= Sync / toast ================= */
let pending = 0;
function syncState(){
  const el = document.getElementById('sync');
  if (S.status==='nodb'){ el.className='sync off'; el.lastElementChild.textContent='Ej ansluten'; return; }
  if (S.status==='timeout'){ el.className='sync off'; el.lastElementChild.textContent='Ingen kontakt – försöker igen'; return; }
  if (pending>0){ el.className='sync saving'; el.lastElementChild.textContent='Sparar…'; return; }
  if (S.status==='ready'){ el.className='sync'; el.lastElementChild.textContent='Live · alla ändringar sparade'; return; }
  el.className='sync off'; el.lastElementChild.textContent='Ansluter…';
}
function toast(msg, action){
  const box = document.getElementById('toasts');
  const t = document.createElement('div'); t.className='toast';
  const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  if (action){ const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { t.remove(); action.fn(); }; t.appendChild(b); }
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), action ? 7000 : 3500);
}
function errMsg(e){
  const c = e && e.code;
  if (c==='invalid_argument') return 'Du har bara läsbehörighet till planeringen.';
  if (c==='quota_exceeded') return 'Lagringsutrymmet är fullt.';
  return 'Ändringen kunde inte sparas. Kontrollera anslutningen och försök igen.';
}

/* ================= Writes ================= */
async function writeChanges(changes){
  const byWk = new Map();
  for (const c of changes){ if (!byWk.has(c.wk)) byWk.set(c.wk, {}); const w = byWk.get(c.wk); (w[c.pid] ||= {})[c.d] = fullShape(c.val); }
  for (const [wk, cells] of byWk){
    const ref = S.db.doc('weeks/'+wk);
    const snap = await ref.get();
    if (snap.exists) await ref.update({cells});
    else await ref.set({key: wk, cells});
  }
}
const UNDO = [];
function undo(){ const prev = UNDO.pop(); if (!prev){ toast('Det finns inget att ångra.'); return; } commit(prev, 'Ändringen är ångrad', false); }
async function commit(changes, label, undoable=true){
  if (!S.db || !changes.length) return;
  const prev = changes.map(c => ({...c, val: cleanVal(getCell(c.wk,c.pid,c.d))}));
  if (undoable){ UNDO.push(prev); if (UNDO.length > 60) UNDO.shift(); }
  for (const c of changes) setLocal(c.wk,c.pid,c.d,c.val);
  render();
  pending++; syncState();
  try {
    await writeChanges(changes);
    if (label) toast(label, undoable ? {label:'Ångra', fn: undo} : null);
  } catch(e){
    for (const c of prev) setLocal(c.wk,c.pid,c.d,c.val);
    if (undoable) UNDO.pop();
    render(); toast(errMsg(e));
    if (e && e.code==='invalid_argument'){ S.canWrite=false; render(); }
  } finally { pending--; syncState(); }
}
async function saveDoc(path, data, merge=true){
  if (!S.db) return false;
  pending++; syncState();
  try { const ref = S.db.doc(path); if (merge){ const s = await ref.get(); if (s.exists) await ref.update(data); else await ref.set(data); } else await ref.set(data); return true; }
  catch(e){ toast(errMsg(e)); return false; }
  finally { pending--; syncState(); }
}
async function deleteDoc(path){
  if (!S.db) return;
  pending++; syncState();
  try { await S.db.doc(path).delete(); } catch(e){ toast(errMsg(e)); } finally { pending--; syncState(); }
}

  if (e.key==='Escape'){ closePicker(); closeModal(); clearMulti(); return; }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'');
  if (typing) return;

  if (e.key==='Enter' && multi.size && !popEl){ e.preventDefault(); barEl?.querySelector('#mbPick')?.click(); }

function computeStats(start, weeks){
  const cs = columns(start, weeks), people = craftPeople();
  const proj = new Map(); let planned=0, absent=0, empty=0, capacity=0;
  for (const p of people) for (let ci=0; ci<cs.length; ci++){
    const c = cs[ci], L = loadOf(getCell(c.wk,p.id,c.d));
    for (const [pid,w] of Object.entries(L.proj)){
      if (!proj.has(pid)) proj.set(pid, {id:pid, perCol:new Array(cs.length).fill(0), total:0, own:0, hired:0, crew:new Map()});
      const s = proj.get(pid); s.perCol[ci]+=w; s.total+=w; isOwn(p)?s.own+=w:s.hired+=w;
      if (!s.crew.has(p.id)) s.crew.set(p.id, {person:p, days:new Array(cs.length).fill(false), n:0});
      const cr = s.crew.get(p.id); cr.days[ci]=true; cr.n+=w;
    }
    planned += L.work;
    if (c.off) continue;
    capacity++; absent += L.abs; empty += Math.max(0, 1 - L.work - L.abs);
  }
  const list = [...proj.values()].map(s => ({...s, project: projById(s.id)})).filter(s=>s.project).sort((a,b)=>b.total-a.total);
  return {cols:cs, people, list, planned, absent, empty, capacity};
}

async function logoData(){

    const blob = await res.blob(); const url = URL.createObjectURL(blob);
    const img = await new Promise((ok,no)=>{ const i = new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const w = img.naturalWidth || 400, h = img.naturalHeight || 120, scale = Math.min(1, 1200/w);
    const cv = document.createElement('canvas'); cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);

async function buildPdf(start, weeks, withProj, withNotes, withWeekend){

    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...INK);
    doc.text('Sydbyggarna Resursplanering', W/2, 14.2, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...MUTED);

  });

    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...MUTED); doc.text('PROJEKT', M, y); if (people.some(p=>!isOwn(p))){ doc.setLineDashPattern([0.8,0.6],0); doc.setDrawColor(151,117,63); doc.setFillColor(247,241,229); doc.setLineWidth(.3); doc.roundedRect(W-M-46, y-3, 6, 4, .8, .8, 'FD'); doc.setLineDashPattern([],0); doc.setFont('helvetica','normal'); doc.text('Inhyrd hantverkare', W-M-38, y); doc.setFont('helvetica','bold'); } y += 4;

    const side = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth-side)/2, sy = (img.naturalHeight-side)/2;

}

function getNeed(wk,pid,d){ const w = S.demand.get(wk); return (w && w.need && w.need[pid] && +w.need[pid][d]) || 0; }
function needMeta(wk,pid){ const w = S.demand.get(wk); return (w && w.meta && w.meta[pid]) || null; }
async function writeNeed(changes, metaByWk){
  if (!S.db) return false;
  const byWk = new Map();
  const ensure = wk => { if (!byWk.has(wk)) byWk.set(wk, {need:{}, meta:{}}); return byWk.get(wk); };
  for (const c of changes){ (ensure(c.wk).need[c.pid] ||= {})[c.d] = c.val; }
  if (metaByWk) for (const [wk,m] of Object.entries(metaByWk)) Object.assign(ensure(wk).meta, m);
  for (const [wk,body] of byWk){ const cur = S.demand.get(wk) || {need:{}, meta:{}}; for (const [pid,ds] of Object.entries(body.need)) cur.need[pid] = {...(cur.need[pid]||{}), ...ds}; Object.assign(cur.meta ||= {}, body.meta); S.demand.set(wk, cur); }
  render(); pending++; syncState();
  try {
    for (const [wk,body] of byWk){
      const ref = S.db.doc('demand/'+wk); const snap = await ref.get();
      const data = {need: body.need}; if (Object.keys(body.meta).length) data.meta = body.meta;
      if (snap.exists) await ref.update(data); else await ref.set({key:wk, need:body.need, meta:body.meta});
    }
    return true;
  } catch(e){ toast(errMsg(e)); return false; }
  finally { pending--; syncState(); }
}
function balance(cs){
  const people = craftPeople();
  return cs.map(c => {
    let avail = 0, planned = 0, need = 0; const free = [], perProj = {};
    for (const p of people){
      const L = loadOf(getCell(c.wk,p.id,c.d));
      for (const [pid,w] of Object.entries(L.proj)){ (perProj[pid] ||= {need:0, planned:0, crew:[]}); perProj[pid].planned += w; perProj[pid].crew.push(p); }
      if (c.off){ avail += L.work; planned += L.work; continue; }
      const cap = Math.max(0, 1 - L.abs); avail += cap; planned += Math.min(L.work, cap);
      if (L.work + L.abs < 1) free.push(p);
    }
    const dm = S.demand.get(c.wk);
    if (dm && dm.need) for (const [pid,days] of Object.entries(dm.need)){ const n = +(days||{})[c.d] || 0; if (n){ need += n; (perProj[pid] ||= {need:0, planned:0, crew:[]}).need = n; } }
    return {c, avail, planned, need, free, perProj, bal: avail - need};
  });
}
function projectSummary(B){
  const m = new Map();
  B.forEach((b,ci) => { for (const [pid,x] of Object.entries(b.perProj)){
    if (!m.has(pid)) m.set(pid, {pid, need:0, planned:0, short:0, over:0, crew:new Map(), perCol:B.map(()=>({need:0,planned:0}))});
    const s = m.get(pid); s.need += x.need; s.planned += x.planned; s.perCol[ci] = {need:x.need, planned:x.planned};
    if (x.need){ s.short += Math.max(0, x.need - x.planned); s.over += Math.max(0, x.planned - x.need); s.plannedOnNeed = (s.plannedOnNeed||0) + x.planned; }
    for (const p of x.crew) s.crew.set(p.id, p);
  }});
  return [...m.values()].map(s => ({...s, project: projById(s.pid), crew:[...s.crew.values()], status: !s.need ? 'none' : s.short ? 'under' : s.over ? 'over' : 'ok'}))
    .filter(s => s.project).sort((a,b) => (b.short-a.short) || (b.need-a.need) || (b.planned-a.planned));
}

let dashQ = '';
function balanceChart(B, width){
  const n = B.length, padL = 30, padR = 8, padT = 14, plotH = 168, padB = 46;
  const colW = Math.max(30, (width - padL - padR) / n), W = padL + padR + colW*n, H = padT + plotH + padB;
  const maxV = Math.max(4, ...B.map(b=>Math.max(b.avail, b.need, b.planned)));
  const step = Math.max(1, Math.ceil(maxV/4)), top = step*4;
  const y = v => padT + plotH - (v/top)*plotH, base = y(0);
  const bw = Math.min(22, colW*.5);
  const rt = (x,yy,w,h,r) => { if (h<=0) return ''; r = Math.min(r,h,w/2); return `M${x},${yy+h}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+w-r}Q${x+w},${yy} ${x+w},${yy+r}V${yy+h}Z`; };
  let g = '';
  for (let v=0; v<=top; v+=step) g += `<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" class="ch-grid ${v===0?'base':''}"/><text x="${padL-8}" y="${y(v)+4}" class="ch-ax" text-anchor="end">${v}</text>`;
  B.forEach((b,i) => {
    const cx = padL + colW*i + colW/2, x0 = cx - bw/2;
    if (i>0 && b.c.di===0) g += `<line x1="${padL+colW*i}" x2="${padL+colW*i}" y1="${padT}" y2="${H-14}" class="ch-wk"/>`;
    if (b.c.di===0) g += `<text x="${padL+colW*i+4}" y="${H-4}" class="ch-wkl">Vecka ${b.c.w}</text>`;
    if (b.c.off) g += `<rect x="${padL+colW*i+1}" y="${padT}" width="${colW-2}" height="${plotH}" class="ch-off ${b.c.hol?'hol':''}"/>`;
    g += `<path d="${rt(x0, y(b.avail), bw, base-y(b.avail), 4)}" class="ch-cap"/>`;
    g += `<path d="${rt(x0+3, y(Math.min(b.planned,b.avail||b.planned)), bw-6, base-y(Math.min(b.planned,b.avail||b.planned)), 3)}" class="ch-plan"/>`;
    if (b.need) g += `<line x1="${x0-5}" x2="${x0+bw+5}" y1="${y(b.need)}" y2="${y(b.need)}" class="ch-need"/>`;
    g += `<text x="${cx}" y="${base+16}" class="ch-day ${b.c.today?'today':''} ${b.c.hol?'hol':''}" text-anchor="middle">${colW<34 ? DAYS[b.c.di][0] : DAYS[b.c.di].slice(0,2)} ${b.c.date.getDate()}</text>`;
    if (b.need && b.bal<0) g += `<text x="${cx}" y="${base+31}" class="ch-def" text-anchor="middle">▼${fmtN(-b.bal)}</text>`;
    else if (b.need && b.bal>0) g += `<text x="${cx}" y="${base+31}" class="ch-sur" text-anchor="middle">+${fmtN(b.bal)}</text>`;
    const tip = `<div class="tt-h">${esc(DAYS_LONG[b.c.di])} ${b.c.date.getDate()} ${MONTHS[b.c.date.getMonth()]} · v.${b.c.w}${b.c.hol?' · '+esc(b.c.hol):''}</div>
      <div class="tt-r"><i class="k cap"></i><span>Tillgänglig personal</span><b>${fmtN(b.avail)}</b></div>
      <div class="tt-r"><i class="k plan"></i><span>Planerat</span><b>${fmtN(b.planned)}</b></div>
      <div class="tt-r"><i class="k need"></i><span>Behov enligt veckobrev</span><b>${b.need||'–'}</b></div>
      ${b.need?`<div class="tt-r tt-bal"><span>Balans</span><b class="${b.bal<0?'neg':'pos'}">${b.bal>0?'+':''}${fmtN(b.bal)}</b></div>`:''}
      ${Object.entries(b.perProj).filter(([,x])=>x.need>x.planned).map(([pid,x])=>{ const p = projById(pid); return p?`<div class="tt-r"><i class="k" style="background:${esc(p.color)}"></i><span>${esc(p.number)} saknar</span><b class="neg">${fmtN(x.need-x.planned)}</b></div>`:''; }).join('')}`;
    g += `<rect x="${padL+colW*i}" y="${padT}" width="${colW}" height="${plotH+20}" class="ch-hit" data-tip="${tipId(tip)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Tillgänglig personal, planerat och behov per dag">${g}</svg>`;
}

  else if (S.view==='projekt') renderOverview();
  else if (S.view==='register') renderRegister();
  else renderPlanning();
  const scr2 = document.getElementById('scroller'); if (scr2 && scr){ scr2.scrollLeft = sl; scr2.scrollTop = stp; }
  syncState();
}
const VIEWS = ['oversikt','planering','behov','projekt','register'];
function route(){
  const h = location.hash.replace('#','');
  const v = VIEWS.includes(h) ? h : 'oversikt';
  if (v!==S.view){ S.view = v; sel = null; closePicker(false); }
  render();
}
addEventListener('hashchange', route);
S.view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'oversikt';
renderLogo(); render();

/* ================= Boot ================= */
let rerenderQueued = false;
const queueRender = () => { if (rerenderQueued) return; rerenderQueued = true; requestAnimationFrame(() => { rerenderQueued = false; const ae = document.activeElement, typing = ae && $main.contains(ae) && (ae.tagName==='TEXTAREA' || (ae.tagName==='INPUT' && !/checkbox|file/.test(ae.type)) || (ae.tagName==='SELECT' && S.view==='register')); if (!dragging && !popEl && !typing) render(); else setTimeout(queueRender, 400); }); };
async function boot(){
  if (!window.claude || !window.claude.use){ S.status='nodb'; render(); return; }
  const [db, user, assets, downloads, sample] = await Promise.all(['db','user','assets','downloads','sample'].map(n => window.claude.use(n).catch(()=>null)));
  S.db = db; S.user = user; S.assets = assets; S.downloads = downloads; S.sample = sample;
  if (!db){ S.status='nodb'; render(); return; }
  if (user){ try { const w = await user.can('data.write'); if (w===false) S.canWrite = false; } catch(e){} }
  const got = {people:false, projects:false, weeks:false};
  const timer = setTimeout(() => { if (S.status!=='ready'){ S.status='timeout'; render(); } }, 10000);
  const ready = () => { if (got.people && got.projects && got.weeks && S.status!=='ready'){ S.status='ready'; clearTimeout(timer); render(); } };
  const fail = e => { clearTimeout(timer); S.status='ready'; if (e && e.code==='revoked') S.canWrite=false; render(); };
  db.collection('people').onSnapshot(s => { S.people = s.docs.map(d => ({id:d.id, ...d.data()})); got.people = true; ready(); queueRender(); }, fail);
  db.collection('projects').onSnapshot(s => { S.projects = s.docs.map(d => ({id:d.id, ...d.data(), number:String(d.data().number??'')})); got.projects = true; ready(); queueRender(); }, fail);
  db.collection('weeks').onSnapshot(s => { const m = new Map(); for (const d of s.docs){ m.set(d.id, JSON.parse(JSON.stringify(d.data().cells||{}))); } S.weeksData = m; got.weeks = true; ready(); queueRender(); }, fail);
  db.collection('demand').onSnapshot(s => { const m = new Map(); for (const d of s.docs){ const x = d.data(); m.set(d.id, JSON.parse(JSON.stringify({need:x.need||{}, meta:x.meta||{}}))); } S.demand = m; queueRender(); }, () => {});
  db.doc('settings/main').onSnapshot(s => { S.settings = s.exists ? {...s.data()} : {}; renderLogo(); queueRender(); }, () => {});
}
boot();
})();
</script>
